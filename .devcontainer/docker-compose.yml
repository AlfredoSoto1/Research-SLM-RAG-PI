name: slm-rag-pi-dev

services:
  rag-workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    mem_limit: 4g
    mem_reservation: 2g
    volumes:
      - ..:/workspace:cached
      - rag-frontend-node-modules:/workspace/frontend/node_modules
      - rag-next-cache:/workspace/frontend/.next
    env_file:
      - ../.env
    ports:
      - "43000:3000"
      - "18080:8080"
    command: sleep infinity
    working_dir: /workspace
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      rag-db:
        condition: service_healthy
    networks:
      - rag-dev-network

  rag-db:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    env_file:
      - ../.env
    ports:
      - "15432:5432"
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
    networks:
      - rag-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rag-pgdata:
  rag-frontend-node-modules:
  rag-next-cache:

networks:
  rag-dev-network:
    driver: bridge

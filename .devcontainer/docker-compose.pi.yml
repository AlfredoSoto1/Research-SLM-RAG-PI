services:
  rag-workspace:
    # This override is for a Dev Container running on the Pi itself.
    # Root inside the container can access the passed-through GPIO device.
    user: "0:0"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      # Uncomment after enabling the corresponding interfaces on the Pi:
      # - "/dev/i2c-1:/dev/i2c-1"
      # - "/dev/spidev0.0:/dev/spidev0.0"
      # - "/dev/spidev0.1:/dev/spidev0.1"
      # - "/dev/serial0:/dev/serial0"
